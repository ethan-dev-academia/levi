<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Levi</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="loading">
      <div class="ld-art"><img id="ld-img" alt="" /></div>
      <div class="ld-shade"></div>
      <header class="ld-brand"><b>Levi</b><span>A world above the clouds</span></header>
      <article class="ld-lore">
        <small>From the Archive</small>
        <h2 id="ld-title"></h2>
        <i class="ld-rule"></i>
        <p id="ld-text"></p>
      </article>
      <footer class="ld-foot">
        <div class="ld-tip"><span>Tip</span><p id="ld-tip"></p></div>
        <div class="ld-progress">
          <div id="ld-status">Waking the world…</div>
          <div class="ld-bar"><i id="ld-fill"></i></div>
        </div>
      </footer>
    </div>
    <div id="app">
      <main id="stage">
        <canvas id="viewport"></canvas>
        <section id="chat">
          <div id="chat-log"></div>
          <input id="chat-input" type="text" maxlength="120" autocomplete="off" spellcheck="false" placeholder="Say something…" />
        </section>
        <section id="hud"></section>
      </main>

      <aside id="side">
        <div id="minimap-wrap">
          <canvas id="minimap" width="214" height="214"></canvas>
        </div>
        <nav id="tabs"></nav>
        <section id="tab-content"></section>
      </aside>
    </div>
    <script type="module" src="/src/loading.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
